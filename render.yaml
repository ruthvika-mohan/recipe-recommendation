services:
  - type: web
    name: garden-guide-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: GARDEN_ALLOWED_ORIGINS
        sync: false
      - key: GARDEN_SUPABASE_URL
        sync: false
      - key: GARDEN_SUPABASE_SERVICE_ROLE_KEY
        sync: false
